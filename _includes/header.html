<!-- Google Tag Manager (noscript) -->
<noscript>
  <iframe src="https://www.googletagmanager.com/ns.html?id={{ site.google_tag_manager }}"
          height="0" width="0" style="display:none;visibility:hidden"></iframe>
</noscript>
<!-- End Google Tag Manager (noscript) -->

<nav class="navbar sticky-top navbar-expand-md navbar-dark">
  <a class="navbar-brand" href="{{ site.url }}{{ site.baseurl }}/">
    <img src="{{ site.url }}{{ site.baseurl }}/favicon.ico"
         width="30"
         height="30"
         style="margin-right:5px"
         class="d-inline-block align-top"
         alt="IEEE GSB @ OSU">
    {{ site.title | escape }}
  </a>

  <button class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarColor02"
          aria-controls="navbarColor02"
          aria-expanded="false"
          aria-label="Toggle navigation">
    <span class="navbar-toggler-icon"></span>
  </button>

  <div class="collapse navbar-collapse" id="navbarColor02">

    <!-- LEFT NAV LINKS -->
    <div class="navbar-nav">
      <a class="nav-item nav-link" href="{{ site.url }}{{ site.baseurl }}/">Home</a>
    {% for p in site.nav_pages %}
      <a class="nav-item nav-link {% if page.url contains p.name %}active{% endif %}"
         href="{{ site.url }}{{ site.baseurl }}/{{ p.name }}">
        {{ p.name | capitalize }}
      </a>
    {% endfor %}
    </div>

    <!-- RIGHT SIDE (THEME TOGGLE) -->
    <div class="navbar-nav ms-auto">
      <button
        id="theme-toggle"
        type="button"
        class="btn btn-link nav-link"
        aria-label="Toggle light/dark mode"
        style="font-size:18px; text-decoration:none;">
        ☀️
      </button>
    </div>

  </div>
</nav>
