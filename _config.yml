# Site settings
title: IEEE Graduate Student Branch (GSB) @ The Ohio State University
email: ieee.gsb@osu.edu
description: IEEE Graduate Student Branch at The Ohio State University
baseurl: ""   # keep "" for user/organization pages, set "/repo-name" if using a project page
url: "https://ieeegsbosu.github.io"  # update if your GitHub Pages URL differs

# Google analytics ID: Uncomment and add your own if you like
# google_analytics: XX
# google_analytics_4: G-XXXXXXXXXX
# google_tag_manager: GTM-XXXXXXX

# Footer info
affiliation: >
  IEEE Graduate Student Branch (GSB)<br/>
  The Ohio State University<br/>
  IEEE Student Activities

location: >
  The Ohio State University<br/>
  Columbus, OH, USA

contact: >
  <a href="mailto:ieee.gsb@osu.edu" target="_blank"><i class="fa fa-envelope fa-1x"></i> Contact IEEE GSB via email</a> <br/>
  <a href="https://github.com/ieeegsbosu/website"><i class="fa fa-github fa-1x"></i> GitHub Repository</a>

# Pages shown in navbar
# NOTE: these names must match markdown files in _pages/ (e.g., _pages/about.md => "about")
nav_pages:
  - name: team

include:
  - .htaccess
  - _pages

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true

# Plugins
# You can keep scholar enabled, but it isn't needed for Home/About/People.
# If GitHub Pages build fails due to plugins, comment this out and remove scholar block below.
plugins: ["jekyll/scholar"]

# Scholar (not used right now, but kept to avoid breaking template pages)
scholar:
  last_name: GSB
  first_name: [IEEE]

  style: citesty
  locale: en

  source: /assets/
  bibliography: ref.bib
  bibliography_template: bibtemplate
  sort_by: year, month
  order: descending

  replace_strings: true
  join_strings: true

  details_dir: bibliography
  details_layout: bibtex.html
  details_link: Details

  query: "@*"

  bibliography_list_attributes:
    reversed: "reversed"

exclude:
  - Gemfile
  - Gemfile.lock
  - update_boostrap.sh
  - switch_theme.sh
  - tags
  - Rakefile
